<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>中式八球解球工具</title>


<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --accent: #e94560;
    --gold: #f0c040;
    --text: #e0e0e0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: var(--surface);
    flex-wrap: wrap;
    justify-content: center;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .toolbar .section { display: flex; gap: 4px; align-items: center; }
  .toolbar .label {
    color: #888; font-size: 11px; margin-right: 2px; white-space: nowrap;
  }
  .btn {
    border: 1.5px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.06);
    color: #ccc;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.95); }
  .btn.active { border-color: var(--accent); background: rgba(233,68,96,0.2); color: #fff; }
  .btn.ball-cue { min-width: 42px; text-align: center; }
  .btn.ball-target { min-width: 42px; text-align: center; }
  .btn.ball-obstacle { min-width: 42px; text-align: center; }
  .btn.ball-pocket { min-width: 42px; text-align: center; }
  .canvas-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  canvas {
    display: block;
    touch-action: none;
  }
  .bottom-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: var(--surface);
    justify-content: center;
    border-top: 1px solid rgba(255,255,255,0.1);
    flex-wrap: wrap;
  }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
    padding: 8px 18px;
  }
  .btn.simulate {
    background: #2e7d32;
    border-color: #2e7d32;
    color: #fff;
    font-weight: 600;
    padding: 8px 18px;
  }
  .btn.danger {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.2);
  }
  .btn.sound-toggle {
    width: 34px; height: 34px;
    padding: 0;
    font-size: 14px;
    line-height: 34px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.2);
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
    text-align: center;
  }
  .btn.sound-toggle.muted { opacity: 0.4; background: rgba(255,255,255,0.03); }
  .cue-controls {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    background: rgba(0,0,0,0.2);
    justify-content: center;
    flex-wrap: wrap;
    border-top: 1px solid rgba(255,255,255,0.05);
    font-size: 11px;
  }
  .cue-controls .ctrl-group {
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .cue-controls .ctrl-label {
    color: #888;
    font-size: 10px;
    white-space: nowrap;
    min-width: 22px;
  }
  .cue-controls input[type="range"] {
    -webkit-appearance: none;
    width: 70px;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.2);
    outline: none;
  }
  .cue-controls input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }
  .cue-controls .speed-val {
    color: #fff;
    font-size: 11px;
    min-width: 28px;
    text-align: center;
    font-weight: 600;
  }
  .btn-sm {
    padding: 4px 10px;
    font-size: 11px;
    border-radius: 14px;
    border: 1.5px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.05);
    color: #aaa;
    cursor: pointer;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-sm.active { border-color: var(--gold); background: rgba(240,192,64,0.15); color: var(--gold); }
  .btn-sm:active { transform: scale(0.95); }
  .route-info {
    color: #aaa;
    font-size: 11px;
    text-align: center;
    padding: 4px;
    min-height: 20px;
  }
  .route-selector {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    justify-content: center;
    flex-wrap: wrap;
    min-height: 28px;
  }
  .route-selector.hidden { display: none; }
  .route-chip {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 14px;
    border: 2px solid transparent;
    background: rgba(255,255,255,0.05);
    color: #ccc;
    cursor: pointer;
    font-size: 10px;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.15s;
  }
  .route-chip.selected {
    border-color: #fff;
    background: rgba(255,255,255,0.12);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 0 8px rgba(255,255,255,0.15);
  }
  .route-chip:active { transform: scale(0.95); }
  .route-chip .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .route-chip .dist { color: #888; font-size: 9px; }

  /* Aiming Modal */
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.78); z-index: 100;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-overlay.hidden { display: none; }
  .modal-content {
    background: var(--surface); border-radius: 16px; padding: 14px 16px;
    max-width: 370px; width: 92vw; max-height: 88vh; overflow-y: auto;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; color: #fff; font-weight: 600; font-size: 15px;
  }
  .modal-close {
    background: none; border: none; color: #888; font-size: 22px;
    cursor: pointer; padding: 0 4px; line-height: 1;
  }
  .modal-body { display: flex; flex-direction: column; gap: 10px; }
  .modal-footer {
    display: flex; gap: 8px; justify-content: flex-end;
    margin-top: 14px; padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .aim-section { display: flex; flex-direction: column; gap: 5px; align-items: center; }
  .aim-label { color: #aaa; font-size: 11px; text-align: center; width: 100%; }
  .aim-label .hint { color: #666; font-size: 9px; }
  .cue-face-wrap {
    position: relative; width: 150px; height: 150px;
    display: flex; align-items: center; justify-content: center;
  }
  #cueFaceCanvas {
    border-radius: 50%; background: #1a1a1a;
    cursor: pointer; touch-action: none;
  }
  .cue-face-hints {
    display: flex; justify-content: space-between; width: 155px;
    font-size: 9px; color: #555; margin-top: 2px;
  }
  .cushion-adjust-info {
    font-size: 10px; color: var(--gold); text-align: center;
    padding: 3px; min-height: 16px;
  }
  .modal-controls {
    display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap;
  }
  .speed-val { color: #fff; font-size: 11px; min-width: 32px; text-align: center; font-weight: 600; }
  .modal-controls input[type="range"] {
    -webkit-appearance: none; width: 80px; height: 4px;
    border-radius: 2px; background: rgba(255,255,255,0.2); outline: none;
  }
  .modal-controls input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px;
    border-radius: 50%; background: var(--accent); cursor: pointer;
  }
  .btn-sel {
    padding: 5px 12px; font-size: 11px; border-radius: 14px;
    border: 1.5px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.05); color: #aaa;
    cursor: pointer; white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-sel.active { border-color: var(--gold); background: rgba(240,192,64,0.15); color: var(--gold); }
  .btn-sel:active { transform: scale(0.95); }
  .btn.modal-sim {
    background: #2e7d32; border-color: #2e7d32; color: #fff;
    font-weight: 600; padding: 8px 20px; font-size: 14px;
  }
</style>
</head>
<body>

<div class="toolbar">
  <span class="label">放置:</span>
  <div class="section">
    <button class="btn ball-cue active" data-type="cue">⚪ 母球</button>
    <button class="btn ball-target" data-type="target">🔵 目标</button>
    <button class="btn ball-obstacle" data-type="obstacle">🔴 障碍</button>
    <button class="btn ball-pocket" data-type="pocket">⭕ 袋口</button>
  </div>
</div>

<div class="canvas-wrap">
  <canvas id="canvas"></canvas>
</div>

<div class="route-info" id="routeInfo">点击桌面放置球，选择颗星数后计算路线</div>

<div class="route-selector hidden" id="routeSelector"></div>

<div class="bottom-bar">
  <span class="label">颗星:</span>
  <button class="btn cushion-btn" data-n="1">1星</button>
  <button class="btn cushion-btn active" data-n="2">2星</button>
  <button class="btn cushion-btn" data-n="3">3星</button>
  <button class="btn cushion-btn" data-n="4">4星</button>
  <button class="btn cushion-btn" data-n="5">5星</button>
  <button class="btn primary" id="btnCalc">计算路线</button>
  <button class="btn simulate" id="btnSim">物理模拟</button>
  <button class="btn danger" id="btnClear">清空</button>
  <button class="btn sound-toggle" id="btnSound" title="音效">🔊</button>
</div>
<div class="cue-controls">
  <div class="ctrl-group">
    <span class="ctrl-label">速度</span>
    <input type="range" id="speedSlider" min="1" max="10" value="3" step="0.5">
    <span class="speed-val" id="speedVal">3</span>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">杆法</span>
    <button class="btn-sm" data-height="low">低</button>
    <button class="btn-sm active" data-height="mid">中</button>
    <button class="btn-sm" data-height="high">高</button>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">赛</span>
    <button class="btn-sm active" data-spin="none">无</button>
    <button class="btn-sm" data-spin="left">左</button>
    <button class="btn-sm" data-spin="right">右</button>
  </div>
</div>

<!-- Aiming Modal -->
<div id="aimModal" class="modal-overlay hidden">
  <div class="modal-content">
    <div class="modal-header">
      <span>⚡ 击球瞄准设置</span>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-body">
      <div class="aim-section">
        <div class="aim-label">击球点 <span class="hint">(拖拽红点)</span></div>
        <div class="cue-face-wrap">
          <canvas id="cueFaceCanvas" width="150" height="150"></canvas>
        </div>
        <div class="cue-face-hints">
          <span>高杆</span><span>中杆</span><span>低杆</span>
        </div>
      </div>
      <div class="aim-section">
        <div class="aim-label">出杆速度</div>
        <div class="modal-controls">
          <input type="range" id="modalSpeedSlider" min="1" max="10" value="3" step="0.5">
          <span class="speed-val" id="modalSpeedVal">3 m/s</span>
        </div>
      </div>
      <div class="aim-section">
        <div class="aim-label">杆法</div>
        <div class="modal-controls">
          <button class="btn-sel modal-height-btn" data-height="low">低杆</button>
          <button class="btn-sel modal-height-btn active" data-height="mid">中杆</button>
          <button class="btn-sel modal-height-btn" data-height="high">高杆</button>
        </div>
      </div>
      <div class="aim-section">
        <div class="aim-label">旋转(赛)</div>
        <div class="modal-controls">
          <button class="btn-sel modal-spin-btn active" data-spin="none">无</button>
          <button class="btn-sel modal-spin-btn" data-spin="left">左赛</button>
          <button class="btn-sel modal-spin-btn" data-spin="right">右赛</button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn danger" id="modalCancel">取消</button>
      <button class="btn modal-sim" id="modalStartSim">开始模拟 ▶</button>
    </div>
  </div>
</div>

<script>
// ==================== CONFIGURATION ====================
const TABLE_W = 2540; // logical table width (long side, mm)
const TABLE_H = 1270; // logical table height (short side, mm)
const BALL_R = 28.575; // ball radius in logical units (57.15mm diameter)
const POCKET_R = 44; // pocket mouth radius
const SIDE_POCKET_R = 40; // side pocket slightly smaller

// Cushion lines (inner edges of rails)
// Table-edge cushions (used for drawing and pocket checks)
const CUSHIONS = [
  { name: 'top',    x1: 0, y1: 0, x2: TABLE_W, y2: 0, horiz: true },
  { name: 'bottom', x1: 0, y1: TABLE_H, x2: TABLE_W, y2: TABLE_H, horiz: true },
  { name: 'left',   x1: 0, y1: 0, x2: 0, y2: TABLE_H, horiz: false },
  { name: 'right',  x1: TABLE_W, y1: 0, x2: TABLE_W, y2: TABLE_H, horiz: false },
];

// Ball-center cushions (offset by BALL_R — where the ball center actually reflects)
const GHOST_CUSHIONS = [
  { name: 'top',    x1: 0, y1: BALL_R, x2: TABLE_W, y2: BALL_R, horiz: true },
  { name: 'bottom', x1: 0, y1: TABLE_H - BALL_R, x2: TABLE_W, y2: TABLE_H - BALL_R, horiz: true },
  { name: 'left',   x1: BALL_R, y1: 0, x2: BALL_R, y2: TABLE_H, horiz: false },
  { name: 'right',  x1: TABLE_W - BALL_R, y1: 0, x2: TABLE_W - BALL_R, y2: TABLE_H, horiz: false },
];

// Pocket positions in logical coords
const POCKET_POSITIONS = [
  { x: 0, y: 0, r: POCKET_R },                    // top-left corner
  { x: TABLE_W, y: 0, r: POCKET_R },               // top-right corner
  { x: TABLE_W / 2, y: 0, r: SIDE_POCKET_R },       // top side (middle of long rail)
  { x: 0, y: TABLE_H, r: POCKET_R },               // bottom-left corner
  { x: TABLE_W, y: TABLE_H, r: POCKET_R },          // bottom-right corner
  { x: TABLE_W / 2, y: TABLE_H, r: SIDE_POCKET_R }, // bottom side
];

// ==================== STATE ====================
let balls = [];           // { x, y, type: 'cue'|'target'|'obstacle' }
let pocketTarget = null;  // { x, y }
let selectedType = 'cue';
let cushionCount = 2;
let calculatedRoutes = [];
let draggingBall = null;
let dragOffset = { x: 0, y: 0 };
let physicsTrails = [];
let simRunning = false;
let simStartTime = 0;
let simPhysicsBodies = null; // array of { x, y, vx, vy, omega, r, type, pocketed }
let hasCalculated = false;
let selectedRouteIndex = 0; // user-selected route for simulation
let simResult = null;  // { targetPocketed: bool, cueScratched: bool }
let cueSpeed = 3;      // m/s, default 3
let cueHeight = 'mid'; // 'high' | 'mid' | 'low'
let cueSpin = 'none';  // 'left' | 'none' | 'right'

// Aiming modal state
let cueFaceHitX = 0.5, cueFaceHitY = 0.5;
let aimModalOpen = false;
let adjustedFirstCushion = null;
let isDraggingCueFace = false;
let isDraggingCushionPoint = false;
let customRoute = null; // user-dragged custom route
let cushionDragStartPos = null; // track drag start to distinguish tap vs drag

// ==================== CANVAS SETUP ====================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let tableOriginX = 0; // canvas x of table top-left
let tableOriginY = 0;
let tableScale = 1;   // logical -> canvas scale
let tableCanvasW = 0; // canvas width of table
let tableCanvasH = 0;

function resize() {
  const wrap = canvas.parentElement;
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  // Fit table in landscape (long side horizontal) with padding
  const pad = 24;
  const availW = w - pad * 2;
  const availH = h - pad * 2;
  const tableAspect = TABLE_W / TABLE_H; // 2:1

  if (availW / availH > tableAspect) {
    // height constrained
    tableCanvasH = availH;
    tableCanvasW = availH * tableAspect;
  } else {
    // width constrained
    tableCanvasW = availW;
    tableCanvasH = availW / tableAspect;
  }

  tableScale = tableCanvasW / TABLE_W;
  tableOriginX = (w - tableCanvasW) / 2;
  tableOriginY = (h - tableCanvasH) / 2;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
}

function toCanvas(tx, ty) {
  return {
    x: tableOriginX + tx * tableScale,
    y: tableOriginY + ty * tableScale,
  };
}

function toLogical(cx, cy) {
  return {
    x: (cx - tableOriginX) / tableScale,
    y: (cy - tableOriginY) / tableScale,
  };
}

window.addEventListener('resize', resize);
resize();

// ==================== DRAWING ====================
function drawTable() {
  const ox = tableOriginX, oy = tableOriginY;
  const tw = tableCanvasW, th = tableCanvasH;
  const s = tableScale;

  // Outer rail (wood color)
  const railW = 28 * s;
  ctx.fillStyle = '#5D3A1A';
  ctx.fillRect(ox - railW, oy - railW, tw + railW * 2, th + railW * 2);

  // Rail top highlight
  ctx.fillStyle = '#7A4E2D';
  ctx.fillRect(ox - railW, oy - railW, tw + railW * 2, railW * 0.6);
  ctx.fillRect(ox - railW, oy + th + railW * 0.4, tw + railW * 2, railW * 0.6);
  ctx.fillRect(ox - railW, oy - railW, railW * 0.6, th + railW * 2);
  ctx.fillRect(ox + tw + railW * 0.4, oy - railW, railW * 0.6, th + railW * 2);

  // Playing surface
  const grd = ctx.createLinearGradient(ox, oy, ox, oy + th);
  grd.addColorStop(0, '#1B7A3D');
  grd.addColorStop(0.5, '#1E8C47');
  grd.addColorStop(1, '#176B34');
  ctx.fillStyle = grd;
  ctx.fillRect(ox, oy, tw, th);

  // Cushion inner edge line
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  ctx.strokeRect(ox, oy, tw, th);

  // Diamond markers on rails
  ctx.fillStyle = '#f0c040';
  const dmSize = 3 * s;
  // Top rail diamonds (3 per half, 6 total + start/end)
  for (let i = 0; i <= 8; i++) {
    const dx = ox + tw * (i / 8);
    ctx.beginPath();
    ctx.arc(dx, oy - railW * 0.55, dmSize, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(dx, oy + th + railW * 0.55, dmSize, 0, Math.PI * 2);
    ctx.fill();
  }
  // Side rail diamonds (short rails)
  for (let i = 1; i <= 3; i++) {
    const dy = oy + th * (i / 4);
    ctx.beginPath();
    ctx.arc(ox - railW * 0.55, dy, dmSize, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(ox + tw + railW * 0.55, dy, dmSize, 0, Math.PI * 2);
    ctx.fill();
  }

  // Head string line
  const headStrX = ox + tw * 0.25;
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 8]);
  ctx.beginPath();
  ctx.moveTo(headStrX, oy);
  ctx.lineTo(headStrX, oy + th);
  ctx.stroke();
  // Center spot
  const cx = ox + tw * 0.5, cy = oy + th * 0.5;
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.beginPath();
  ctx.arc(cx, cy, 4 * s, 0, Math.PI * 2);
  ctx.fill();
  // Foot spot (2/3 from head)
  const fsX = ox + tw * (2/3);
  const fsY = cy;
  ctx.beginPath();
  ctx.arc(fsX, fsY, 3 * s, 0, Math.PI * 2);
  ctx.fill();

  ctx.setLineDash([]);

  // Pockets
  POCKET_POSITIONS.forEach((p, i) => {
    const pc = toCanvas(p.x, p.y);
    const pr = p.r * s;

    // Pocket hole
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(pc.x, pc.y, pr, 0, Math.PI * 2);
    ctx.fill();

    // Pocket rim
    ctx.strokeStyle = '#3a3a3a';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Pocket highlight
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath();
    ctx.arc(pc.x, pc.y, pr * 0.7, 0, Math.PI * 2);
    ctx.fill();
  });

  // Cushion numbering (diamond system labels)
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.font = `${Math.max(9, 11 * s)}px sans-serif`;
  ctx.textAlign = 'center';
  const numPad = 18 * s;
  for (let i = 0; i <= 8; i++) {
    const dx = ox + tw * (i / 8);
    ctx.fillText(i, dx, oy - numPad);
    ctx.fillText(i, dx, oy + th + numPad + 10 * s);
  }

  // Highlight pockets when in pocket selection mode
  if (selectedType === 'pocket') {
    const pulse = Math.sin(Date.now() / 400) * 0.3 + 0.7;
    POCKET_POSITIONS.forEach((p) => {
      const pc = toCanvas(p.x, p.y);
      ctx.strokeStyle = `rgba(240, 192, 64, ${pulse})`;
      ctx.lineWidth = 2.5;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.arc(pc.x, pc.y, p.r * s * 1.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    });
  }
}

function drawBalls() {
  const s = tableScale;
  const r = BALL_R * s;

  // During simulation, draw physics body positions directly in mm
  const bodies = simRunning ? simPhysicsBodies : null;

  if (bodies) {
    bodies.forEach((pb) => {
      if (pb.pocketed) return;
      const p = toCanvas(pb.x, pb.y);

      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.arc(p.x + 1.5, p.y + 1.5, r, 0, Math.PI * 2);
      ctx.fill();

      let color, borderColor;
      if (pb.type === 'cue') { color = '#f5f5f0'; borderColor = '#ccc'; }
      else if (pb.type === 'target') { color = '#2266cc'; borderColor = '#1144aa'; }
      else if (pb.type === 'obstacle') { color = '#cc3333'; borderColor = '#991111'; }

      const grad = ctx.createRadialGradient(p.x - r*0.3, p.y - r*0.3, r*0.1, p.x, p.y, r);
      grad.addColorStop(0, color);
      grad.addColorStop(1, borderColor);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.beginPath();
      ctx.arc(p.x - r*0.25, p.y - r*0.3, r*0.35, 0, Math.PI * 2);
      ctx.fill();

      if (pb.type === 'obstacle') {
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, r*0.85, r*0.3, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      if (pb.type === 'target') {
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.max(10, r*0.8)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('目', p.x, p.y);
      }
    });
  } else {
    balls.forEach((ball) => {
      const p = toCanvas(ball.x, ball.y);

      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.arc(p.x + 1.5, p.y + 1.5, r, 0, Math.PI * 2);
      ctx.fill();

      // Ball body
      let color, borderColor;
      if (ball.type === 'cue') {
        color = '#f5f5f0';
        borderColor = '#ccc';
      } else if (ball.type === 'target') {
        color = '#2266cc';
        borderColor = '#1144aa';
      } else if (ball.type === 'obstacle') {
        color = '#cc3333';
        borderColor = '#991111';
      }

      const grad = ctx.createRadialGradient(p.x - r*0.3, p.y - r*0.3, r*0.1, p.x, p.y, r);
      grad.addColorStop(0, color);
      grad.addColorStop(1, borderColor);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fill();

      // Highlight
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.beginPath();
      ctx.arc(p.x - r*0.25, p.y - r*0.3, r*0.35, 0, Math.PI * 2);
      ctx.fill();

      // Stripe for obstacle balls
      if (ball.type === 'obstacle') {
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, r*0.85, r*0.3, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Number label for target
      if (ball.type === 'target') {
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.max(10, r*0.8)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('目', p.x, p.y);
      }
    });
  }

  // Pocket target indicator
  if (pocketTarget) {
    const pp = toCanvas(pocketTarget.x, pocketTarget.y);
    const pulse = Math.sin(Date.now() / 600) * 0.3 + 0.7;
    ctx.strokeStyle = `rgba(240, 192, 64, ${pulse})`;
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.arc(pp.x, pp.y, BALL_R * s * 1.5, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = 'rgba(240,192,64,0.4)';
    ctx.beginPath();
    ctx.arc(pp.x, pp.y, BALL_R * s, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawRoutes() {
  if (!calculatedRoutes.length) return;

  const colors = ['#FFD700', '#FF6B6B', '#4ECDC4', '#FF8C42', '#A78BFA'];
  const s = tableScale;

  // --- Draw original route as faded reference (if custom route exists) ---
  if (customRoute && selectedRouteIndex < calculatedRoutes.length) {
    const route = calculatedRoutes[selectedRouteIndex];
    const color = colors[selectedRouteIndex % colors.length];
    ctx.globalAlpha = 0.22;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;

    route.points.forEach((pt, i) => {
      if (i === 0) return;
      const prev = toCanvas(route.points[i-1].x, route.points[i-1].y);
      const curr = toCanvas(pt.x, pt.y);
      ctx.setLineDash(i <= route.cushionPoints.length ? [4, 8] : []);
      ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(curr.x, curr.y); ctx.stroke();
    });
    ctx.setLineDash([]);

    // Original cushion points — small dim dots
    route.cushionPoints.forEach((cp, ci) => {
      const p = toCanvas(cp.x, cp.y);
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 3.5 * s, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  // --- Draw original routes (full opacity if no custom, low if custom exists) ---
  calculatedRoutes.forEach((route, ri) => {
    const color = colors[ri % colors.length];
    const selected = ri === selectedRouteIndex;
    const isReference = customRoute && selected;

    // Skip drawing selected original route at full opacity when custom exists
    if (isReference) return;

    // Selected route glow
    if (selected && !customRoute) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 5;
      ctx.globalAlpha = 0.3;
      ctx.shadowColor = color;
      ctx.shadowBlur = 10 * s;
      route.points.forEach((pt, i) => {
        if (i === 0) return;
        const prev = toCanvas(route.points[i-1].x, route.points[i-1].y);
        const curr = toCanvas(pt.x, pt.y);
        ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(curr.x, curr.y); ctx.stroke();
      });
      ctx.shadowBlur = 0;
    }

    // Draw path segments
    ctx.strokeStyle = color;
    ctx.lineWidth = selected ? 3.5 : 2;
    ctx.globalAlpha = selected ? 1 : (0.45 + 0.1 * ri);

    route.points.forEach((pt, i) => {
      if (i === 0) return;
      const prev = toCanvas(route.points[i-1].x, route.points[i-1].y);
      const curr = toCanvas(pt.x, pt.y);
      if (i < route.cushionPoints.length + 1) {
        ctx.setLineDash([8, 6]);
      } else {
        ctx.setLineDash([]);
      }
      ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(curr.x, curr.y); ctx.stroke();

      // Arrow
      const ang = Math.atan2(curr.y - prev.y, curr.x - prev.x);
      const arrowLen = selected ? 10 : 8;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(curr.x, curr.y);
      ctx.lineTo(curr.x - arrowLen * Math.cos(ang - 0.5), curr.y - arrowLen * Math.sin(ang - 0.5));
      ctx.lineTo(curr.x - arrowLen * Math.cos(ang + 0.5), curr.y - arrowLen * Math.sin(ang + 0.5));
      ctx.closePath(); ctx.fill();
    });
    ctx.setLineDash([]);

    // Cushion hit points
    route.cushionPoints.forEach((cp, ci) => {
      const p = toCanvas(cp.x, cp.y);
      const r = selected ? 7.5 * s : 5.5 * s;
      if (selected) { ctx.shadowColor = color; ctx.shadowBlur = 8 * s; }
      ctx.fillStyle = color;
      ctx.globalAlpha = selected ? 1 : 0.75;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = selected ? '#fff' : 'rgba(255,255,255,0.6)';
      ctx.lineWidth = selected ? 2.5 : 1.5;
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#000';
      ctx.font = `bold ${Math.max(9, 10*s)}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(ci + 1, p.x, p.y);
    });

    ctx.globalAlpha = 1;
  });

  // --- Draw custom route (bright gold, prominent) ---
  if (customRoute) {
    const color = '#FFD700';
    ctx.globalAlpha = 1;

    // Glow
    ctx.strokeStyle = color;
    ctx.lineWidth = 5;
    ctx.globalAlpha = 0.35;
    ctx.shadowColor = color;
    ctx.shadowBlur = 12 * s;
    customRoute.points.forEach((pt, i) => {
      if (i === 0) return;
      const prev = toCanvas(customRoute.points[i-1].x, customRoute.points[i-1].y);
      const curr = toCanvas(pt.x, pt.y);
      ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(curr.x, curr.y); ctx.stroke();
    });
    ctx.shadowBlur = 0;

    // Path
    ctx.strokeStyle = color;
    ctx.lineWidth = 3.5;
    ctx.globalAlpha = 1;
    customRoute.points.forEach((pt, i) => {
      if (i === 0) return;
      const prev = toCanvas(customRoute.points[i-1].x, customRoute.points[i-1].y);
      const curr = toCanvas(pt.x, pt.y);
      ctx.setLineDash(i <= customRoute.cushionPoints.length ? [8, 6] : []);
      ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(curr.x, curr.y); ctx.stroke();
      const ang = Math.atan2(curr.y - prev.y, curr.x - prev.x);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(curr.x, curr.y);
      ctx.lineTo(curr.x - 10 * Math.cos(ang - 0.5), curr.y - 10 * Math.sin(ang - 0.5));
      ctx.lineTo(curr.x - 10 * Math.cos(ang + 0.5), curr.y - 10 * Math.sin(ang + 0.5));
      ctx.closePath(); ctx.fill();
    });
    ctx.setLineDash([]);

    // Cushion hit points
    customRoute.cushionPoints.forEach((cp, ci) => {
      const p = toCanvas(cp.x, cp.y);
      ctx.shadowColor = color; ctx.shadowBlur = 10 * s;
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 7.5 * s, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#000';
      ctx.font = `bold ${Math.max(9, 10*s)}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(ci + 1, p.x, p.y);

      // Pulse ring on first cushion point
      if (ci === 0) {
        const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 300);
        const r = BALL_R * s * 1.4;
        ctx.strokeStyle = `rgba(240, 192, 64, ${0.35 + pulse * 0.4})`;
        ctx.lineWidth = 3; ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
        if (!isDraggingCushionPoint) {
          ctx.fillStyle = '#fff';
          ctx.font = `bold ${Math.max(9, 10*s)}px sans-serif`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
          ctx.fillText('拖拽调整', p.x, p.y - r - 4);
        }
      }
    });
    ctx.globalAlpha = 1;
  }
}

function drawPhysicsTrails() {
  if (!physicsTrails.length) return;

  physicsTrails.forEach((trail) => {
    if (trail.points.length < 2) return;

    // Draw fading trail - recent points are brighter
    const total = trail.points.length;
    for (let i = 1; i < total; i++) {
      const alpha = 0.2 + 0.7 * (i / total); // fade from old to new
      const width = 1 + 4 * (i / total); // thinner old, thicker new

      ctx.strokeStyle = trail.color;
      ctx.globalAlpha = alpha;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';

      const p0 = toCanvas(trail.points[i-1].x, trail.points[i-1].y);
      const p1 = toCanvas(trail.points[i].x, trail.points[i].y);

      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  });

  // Draw current ball positions as bright dots during simulation
  if (simRunning && simPhysicsBodies) {
    simPhysicsBodies.forEach((pb) => {
      if (pb.pocketed) return;
      const p = toCanvas(pb.x, pb.y);
      const r = BALL_R * tableScale;

      // Glow ring
      const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 200);
      ctx.strokeStyle = pb.type === 'cue' ? `rgba(255,255,255,${0.5 + pulse * 0.4})` :
                       pb.type === 'target' ? `rgba(100,180,255,${0.5 + pulse * 0.4})` :
                       `rgba(255,80,80,0.3)`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r + 4, 0, Math.PI * 2);
      ctx.stroke();
    });
  }
}

function drawDragPreview() {
  if (!draggingBall) return;
  const s = tableScale;
  const r = BALL_R * s;
  const p = toCanvas(draggingBall.x, draggingBall.y);

  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 2;
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.arc(p.x, p.y, r + 3, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawSimOverlay() {
  const cw = canvas.width / (Math.min(window.devicePixelRatio || 1, 2));
  const ch = canvas.height / (Math.min(window.devicePixelRatio || 1, 2));

  // During simulation: show ball position debug at top-left
  if (simRunning && simPhysicsBodies) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(6, 6, 180, 56);
    ctx.fillStyle = '#fff';
    ctx.font = '11px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    let y = 10;
    simPhysicsBodies.forEach((pb) => {
      if (pb.pocketed) return;
      const spd = Math.sqrt(pb.vx*pb.vx + pb.vy*pb.vy).toFixed(0);
      const omega = pb.omega.toFixed(1);
      ctx.fillText(`${pb.type}: (${pb.x.toFixed(0)},${pb.y.toFixed(0)}) v=${spd} ω=${omega}`, 12, y);
      y += 16;
    });
    return; // don't show result overlay during sim
  }

  if (!simResult) return;

  const midX = cw / 2;
  const midY = ch / 2;

  // Dim background
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(0, 0, cw, ch);

  // Result badge
  let text, color;
  if (simResult.targetPocketed) {
    text = '🎯 进球!';
    color = '#4CAF50';
  } else if (simResult.cueScratched) {
    text = '⚠ 母球落袋';
    color = '#FF9800';
  } else {
    text = '未进球';
    color = '#f44336';
  }

  ctx.fillStyle = color;
  ctx.font = 'bold 28px -apple-system, "PingFang SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Text shadow
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillText(text, midX + 1, midY + 1);
  ctx.fillStyle = color;
  ctx.fillText(text, midX, midY);
}

function drawAll() {
  resize();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawTable();
  drawPhysicsTrails();
  drawRoutes();
  drawBalls();
  drawDragPreview();
  drawSimOverlay();
}

function loop() {
  drawAll();
  requestAnimationFrame(loop);
}

// ==================== TOUCH INTERACTION ====================
function getEventPos(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: clientX - rect.left, y: clientY - rect.top };
}

function findBallAt(logX, logY) {
  for (let i = balls.length - 1; i >= 0; i--) {
    const dx = balls[i].x - logX;
    const dy = balls[i].y - logY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < BALL_R * 1.3) return { ball: balls[i], index: i };
  }
  return null;
}

function isInsideTable(x, y) {
  const margin = BALL_R;
  return x >= margin && x <= TABLE_W - margin &&
         y >= margin && y <= TABLE_H - margin;
}

function overlapsAnyBall(x, y, excludeIndex) {
  const minDist = BALL_R * 2;
  for (let i = 0; i < balls.length; i++) {
    if (i === excludeIndex) continue;
    const dx = balls[i].x - x;
    const dy = balls[i].y - y;
    if (Math.sqrt(dx * dx + dy * dy) < minDist) return true;
  }
  return false;
}

function addBall(x, y, type) {
  if (!isInsideTable(x, y)) return;
  if (overlapsAnyBall(x, y, -1)) return;
  if (type === 'cue') {
    balls = balls.filter(b => b.type !== 'cue');
  }
  if (type === 'target') {
    balls = balls.filter(b => b.type !== 'target');
  }
  balls.push({ x, y, type });
  calculatedRoutes = [];
  selectedRouteIndex = 0;
  hasCalculated = false;
  simResult = null;
  updateInfo();
}

let longPressTimer = null;
let longPressTriggered = false;

canvas.addEventListener('pointerdown', (e) => {
  if (simRunning) return;
  const pos = getEventPos(e);
  const log = toLogical(pos.x, pos.y);

  // Cushion drag on first cushion point (main interface, no modal needed)
  if (calculatedRoutes.length > 0 && selectedType !== 'pocket') {
    const route = customRoute || calculatedRoutes[selectedRouteIndex];
    if (route && route.cushionPoints.length > 0) {
      const firstCp = route.cushionPoints[0];
      const dx = log.x - firstCp.x, dy = log.y - firstCp.y;
      if (Math.sqrt(dx * dx + dy * dy) < BALL_R * 5) {
        cushionDragStartPos = { x: log.x, y: log.y };
        canvas.setPointerCapture(e.pointerId);
        return;
      }
    }
  }

  // Check if tapping on a route cushion hit point to select that route
  if (calculatedRoutes.length > 1 && selectedType !== 'pocket') {
    const tapRadius = BALL_R * 3; // generous tap target
    for (let ri = 0; ri < calculatedRoutes.length; ri++) {
      for (const cp of calculatedRoutes[ri].cushionPoints) {
        const dx = log.x - cp.x;
        const dy = log.y - cp.y;
        if (Math.sqrt(dx * dx + dy * dy) < tapRadius) {
          selectedRouteIndex = ri;
          updateRouteSelector();
          return;
        }
      }
    }
  }

  if (selectedType === 'pocket') {
    // Find nearest pocket within generous range
    let nearest = null;
    let minDist = Infinity;
    POCKET_POSITIONS.forEach((pp) => {
      const dx = log.x - pp.x;
      const dy = log.y - pp.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < minDist) { minDist = d; nearest = pp; }
    });
    if (nearest && minDist < POCKET_R * 3) {
      pocketTarget = { x: nearest.x, y: nearest.y };
      calculatedRoutes = [];
      selectedRouteIndex = 0;
      updateInfo();
    }
    return;
  }

  // Check if tapping on existing ball
  const found = findBallAt(log.x, log.y);
  if (found) {
    longPressTriggered = false;
    // Set up long press to delete
    longPressTimer = setTimeout(() => {
      longPressTriggered = true;
      balls.splice(found.index, 1);
      calculatedRoutes = [];
      selectedRouteIndex = 0;
      draggingBall = null;
      updateInfo();
    }, 600);

    draggingBall = found.ball;
    dragOffset.x = found.ball.x - log.x;
    dragOffset.y = found.ball.y - log.y;
    canvas.setPointerCapture(e.pointerId);
    return;
  }

  // Add new ball at tap position
  addBall(log.x, log.y, selectedType);
});

canvas.addEventListener('pointermove', (e) => {
  // Cushion drag — real-time path recalculation
  if (cushionDragStartPos) {
    const pos = getEventPos(e);
    const log = toLogical(pos.x, pos.y);
    // Require minimum movement to enter drag mode (distinguish from tap)
    const moveDx = log.x - cushionDragStartPos.x;
    const moveDy = log.y - cushionDragStartPos.y;
    if (!isDraggingCushionPoint && Math.abs(moveDx) + Math.abs(moveDy) < 3) return;
    isDraggingCushionPoint = true;
    const route = calculatedRoutes[selectedRouteIndex];
    if (route && route.cushionPoints.length > 0) {
      adjustedFirstCushion = snapToCushionSegment(log, route.sequence[0]);
      customRoute = recalcPathFromFirstCushion(route, adjustedFirstCushion);
    }
    e.preventDefault();
    return;
  }
  if (!draggingBall) return;
  if (longPressTriggered) return;

  // Cancel long press if moving
  if (longPressTimer && Math.abs(e.movementX || 0) + Math.abs(e.movementY || 0) > 5) {
    clearTimeout(longPressTimer);
    longPressTimer = null;
  }

  const pos = getEventPos(e);
  const log = toLogical(pos.x, pos.y);

  let newX = log.x + dragOffset.x;
  let newY = log.y + dragOffset.y;

  // Clamp inside table
  newX = Math.max(BALL_R, Math.min(TABLE_W - BALL_R, newX));
  newY = Math.max(BALL_R, Math.min(TABLE_H - BALL_R, newY));

  // Block overlap with other balls
  const dragIdx = balls.indexOf(draggingBall);
  if (!overlapsAnyBall(newX, newY, dragIdx)) {
    draggingBall.x = newX;
    draggingBall.y = newY;
  }
  calculatedRoutes = [];
  selectedRouteIndex = 0;
  updateInfo();
});

canvas.addEventListener('pointerup', () => {
  if (cushionDragStartPos) {
    if (!isDraggingCushionPoint) {
      // Was a tap, not a drag — clear custom route & reselect
      customRoute = null;
    }
    // customRoute stays if user dragged; otherwise cleared above
    isDraggingCushionPoint = false;
    cushionDragStartPos = null;
    return;
  }
  clearTimeout(longPressTimer);
  longPressTimer = null;
  if (!longPressTriggered) {
    draggingBall = null;
  }
});

canvas.addEventListener('pointerleave', () => {
  clearTimeout(longPressTimer);
  longPressTimer = null;
  draggingBall = null;
});

// ==================== MIRROR METHOD ====================
function reflectPoint(px, py, cushion) {
  if (cushion.horiz) {
    // Reflect across horizontal line y = cushion.y1
    return { x: px, y: 2 * cushion.y1 - py };
  } else {
    // Reflect across vertical line x = cushion.x1
    return { x: 2 * cushion.x1 - px, y: py };
  }
}

function lineIntersection(x1, y1, x2, y2, x3, y3, x4, y4) {
  const denom = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);
  if (Math.abs(denom) < 1e-10) return null;
  const t = ((x1 - x3) * (y3 - y4) - (y1 - y3) * (x3 - x4)) / denom;
  return { x: x1 + t * (x2 - x1), y: y1 + t * (y2 - y1), t };
}

function pointOnCushionSegment(pt, cushion) {
  const margin = POCKET_R; // pocket gap
  if (cushion.horiz) {
    // Check if x is within cushion range, excluding pocket gaps
    // Corner pockets + side pocket
    const sideX = TABLE_W / 2;
    const gaps = [
      { x: 0, r: POCKET_R },         // left corner
      { x: TABLE_W, r: POCKET_R },   // right corner
      { x: sideX, r: SIDE_POCKET_R }, // side pocket
    ];
    for (const gap of gaps) {
      if (Math.abs(pt.x - gap.x) < gap.r + BALL_R) return false;
    }
    return true;
  } else {
    // Short rails - only corner pockets to worry about
    const gaps = [
      { y: 0, r: POCKET_R },
      { y: TABLE_H, r: POCKET_R },
    ];
    for (const gap of gaps) {
      if (Math.abs(pt.y - gap.y) < gap.r + BALL_R) return false;
    }
    return true;
  }
}

function distToSegmentSq(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const lenSq = dx * dx + dy * dy;
  if (lenSq === 0) return (px - x1) ** 2 + (py - y1) ** 2;
  let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  const nearX = x1 + t * dx, nearY = y1 + t * dy;
  return (px - nearX) ** 2 + (py - nearY) ** 2;
}

function pathHitsObstacle(points, obstacles, safeDist) {
  for (let i = 0; i < points.length - 1; i++) {
    const p1 = points[i], p2 = points[i + 1];
    for (const obs of obstacles) {
      const d = distToSegmentSq(obs.x, obs.y, p1.x, p1.y, p2.x, p2.y);
      if (d < safeDist * safeDist) return true;
    }
  }
  return false;
}

function generateCushionSequences(n) {
  const indices = [0, 1, 2, 3]; // top, bottom, left, right
  const result = [];

  function recurse(seq) {
    if (seq.length === n) {
      result.push([...seq]);
      return;
    }
    for (const idx of indices) {
      // Avoid hitting same cushion twice in a row
      if (seq.length > 0 && idx === seq[seq.length - 1]) continue;
      // Avoid opposite cushion pairs in succession (unlikely patterns)
      // top(0)->bottom(1) or bottom(1)->top(0) - allow, it's common
      // But skip left->right->left or right->left->right (redundant)
      if (seq.length >= 2) {
        const last = seq[seq.length - 1];
        const prev = seq[seq.length - 2];
        // Skip if same as two-back (e.g., top->bottom->top is fine, left->right->left is not)
        if (idx === prev && (idx === 2 || idx === 3)) continue;
      }
      recurse([...seq, idx]);
    }
  }

  recurse([]);
  return result;
}

function calculateKickRoutes() {
  const cueBall = balls.find(b => b.type === 'cue');
  const targetBall = balls.find(b => b.type === 'target');
  if (!cueBall || !targetBall || !pocketTarget) return [];

  const obstacles = balls.filter(b => b.type === 'obstacle');
  const safeDist = BALL_R * 2.2;

  // Ghost ball position (where cue ball needs to arrive to pocket target)
  const dx = targetBall.x - pocketTarget.x;
  const dy = targetBall.y - pocketTarget.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const ghostX = targetBall.x + (dx / dist) * BALL_R * 2;
  const ghostY = targetBall.y + (dy / dist) * BALL_R * 2;

  // Also check: from ghost ball to pocket - will target ball actually go in?
  // Simplified: assume center-to-center line determines pocket direction

  const sequences = generateCushionSequences(cushionCount);
  const validRoutes = [];

  for (const seq of sequences) {
    // Build mirrored targets (work backwards from ghost ball)
    // Mirror ghost across cushions in reverse order
    let mirrorX = ghostX, mirrorY = ghostY;
    const mirroredTargets = [{ x: mirrorX, y: mirrorY }];

    for (let i = seq.length - 1; i >= 0; i--) {
      const gc = GHOST_CUSHIONS[seq[i]]; // use ball-radius offset cushion
      const ref = reflectPoint(mirrorX, mirrorY, gc);
      mirrorX = ref.x;
      mirrorY = ref.y;
      mirroredTargets.unshift({ x: mirrorX, y: mirrorY });
    }

    // Now unfold: from cueBall, find intersection with first ghost cushion
    // Then from that intersection, find next, etc.
    let currentX = cueBall.x, currentY = cueBall.y;
    const hitPoints = [];
    const allPoints = [{ x: currentX, y: currentY }];
    let valid = true;

    for (let i = 0; i < seq.length; i++) {
      const gc = GHOST_CUSHIONS[seq[i]]; // ball-center reflection line
      const target = mirroredTargets[i]; // mirrored target at this level

      // Find intersection of line (current -> target) with cushion c
      const inter = lineIntersection(
        currentX, currentY, target.x, target.y,
        gc.x1, gc.y1, gc.x2, gc.y2
      );

      if (!inter) { valid = false; break; }

      // Check hit point is on cushion (not in pocket gap)
      if (!pointOnCushionSegment(inter, gc)) { valid = false; break; }

      // Check direction is correct (we're moving toward the cushion)
      if (inter.t < 0 || inter.t > 1.05) { valid = false; break; }

      hitPoints.push({ x: inter.x, y: inter.y });
      allPoints.push({ x: inter.x, y: inter.y });
      currentX = inter.x;
      currentY = inter.y;
    }

    if (!valid) continue;

    // Last segment: from last hit point to ghost ball
    allPoints.push({ x: ghostX, y: ghostY });
    // Then ghost to pocket (target ball path)
    allPoints.push({ x: pocketTarget.x, y: pocketTarget.y });

    // Check obstacle collisions for cue ball path only (up to ghost ball)
    const cuePath = allPoints.slice(0, allPoints.length - 1);
    if (pathHitsObstacle(cuePath, obstacles, safeDist)) continue;

    // Calculate quality score
    let totalDist = 0;
    for (let i = 0; i < allPoints.length - 1; i++) {
      const dx2 = allPoints[i+1].x - allPoints[i].x;
      const dy2 = allPoints[i+1].y - allPoints[i].y;
      totalDist += Math.sqrt(dx2 * dx2 + dy2 * dy2);
    }

    // Check approach angle to ghost ball (should be reasonable)
    const lastSeg = allPoints[allPoints.length - 3];
    const ghostSeg = allPoints[allPoints.length - 2];
    const approachAngle = Math.atan2(
      ghostSeg.y - lastSeg.y,
      ghostSeg.x - lastSeg.x
    );
    const pocketAngle = Math.atan2(
      pocketTarget.y - targetBall.y,
      pocketTarget.x - targetBall.x
    );
    let angleDiff = Math.abs(approachAngle - pocketAngle);
    if (angleDiff > Math.PI) angleDiff = 2 * Math.PI - angleDiff;

    // Valid approach: cue ball should arrive from the opposite side of the pocket
    // Allow up to ~70 degrees off the ideal line
    if (angleDiff > Math.PI * 0.4) continue;

    validRoutes.push({
      points: allPoints,
      cushionPoints: hitPoints,
      totalDist,
      angleDiff,
      sequence: seq.map(i => CUSHIONS[i].name),
    });
  }

  // Sort by distance (shorter is generally easier)
  validRoutes.sort((a, b) => a.totalDist - b.totalDist);

  // Return top 5
  return validRoutes.slice(0, 5);
}

// ==================== CUSTOM POOL PHYSICS ENGINE ====================
// Units: positions in mm, velocities in mm/s, angular velocity in rad/s
// Based on sliding/rolling friction model and momentum-conserving collisions

const PHYS_DT = 1 / 60; // simulation timestep (seconds)
const PHYS_G = 9810; // gravity mm/s² (for cloth friction)
const PHYS_MU_SLIDE = 0.22; // sliding friction coefficient
const PHYS_MU_ROLL = 0.012; // rolling friction coefficient
const PHYS_CUSHION_E = 0.72; // cushion restitution (energy retention)
const PHYS_BALL_E = 0.94; // ball-ball restitution
const PHYS_SPIN_EFFECT = 0; // spin does not affect cushion rebound (mirror-like reflection)

// ==================== AUDIO ENGINE ====================
let audioCtx = null;
let soundEnabled = true;

function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playCushionSound(intensity) {
  if (!soundEnabled) return;
  ensureAudio();
  const t = audioCtx.currentTime;
  const vol = Math.min(0.45, intensity * 0.12);

  // Low thump — sine at ~180Hz
  const osc1 = audioCtx.createOscillator();
  osc1.type = 'sine';
  osc1.frequency.value = 180;
  const g1 = audioCtx.createGain();
  g1.gain.setValueAtTime(vol * 0.7, t);
  g1.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
  osc1.connect(g1).connect(audioCtx.destination);
  osc1.start(t); osc1.stop(t + 0.07);

  // Mid thock — triangle at ~400Hz
  const osc2 = audioCtx.createOscillator();
  osc2.type = 'triangle';
  osc2.frequency.value = 400;
  const g2 = audioCtx.createGain();
  g2.gain.setValueAtTime(vol * 0.5, t);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
  osc2.connect(g2).connect(audioCtx.destination);
  osc2.start(t); osc2.stop(t + 0.05);

  // Short noise burst for texture
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.04, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (data.length * 0.25));
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 500;
  filter.Q.value = 1.2;
  const gn = audioCtx.createGain();
  gn.gain.setValueAtTime(vol * 0.3, t);
  gn.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
  src.connect(filter).connect(gn).connect(audioCtx.destination);
  src.start(t); src.stop(t + 0.05);
}

function playBallSound(intensity) {
  if (!soundEnabled) return;
  ensureAudio();
  const t = audioCtx.currentTime;
  const vol = Math.min(0.35, intensity * 0.1);

  // Sharp click — high sine burst
  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(1800, t);
  osc.frequency.exponentialRampToValueAtTime(600, t + 0.025);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.035);
}

document.getElementById('btnSound').addEventListener('click', () => {
  ensureAudio();
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('btnSound');
  if (soundEnabled) {
    btn.textContent = '🔊';
    btn.classList.remove('muted');
  } else {
    btn.textContent = '🔇';
    btn.classList.add('muted');
  }
});

// Build cushion line segments (with pocket gaps)
function buildCushionSegments() {
  const segs = [];
  function add(x1, y1, x2, y2, horiz) {
    if (horiz) {
      const gaps = [
        { pos: 0, r: POCKET_R },
        { pos: TABLE_W, r: POCKET_R },
        { pos: TABLE_W / 2, r: SIDE_POCKET_R },
      ].sort((a, b) => a.pos - b.pos);
      let start = 0;
      for (const g of gaps) {
        const gs = g.pos - g.r - BALL_R;
        const ge = g.pos + g.r + BALL_R;
        if (gs > start) segs.push({ x1: x1 + start, y1, x2: x1 + gs, y2, horiz: true });
        start = Math.max(start, ge);
      }
      if (start < TABLE_W) segs.push({ x1: x1 + start, y1, x2, y2, horiz: true });
    } else {
      const gaps = [
        { pos: 0, r: POCKET_R },
        { pos: TABLE_H, r: POCKET_R },
      ].sort((a, b) => a.pos - b.pos);
      let start = 0;
      for (const g of gaps) {
        const gs = g.pos - g.r - BALL_R;
        const ge = g.pos + g.r + BALL_R;
        if (gs > start) segs.push({ x1, y1: y1 + start, x2, y2: y1 + gs, horiz: false });
        start = Math.max(start, ge);
      }
      if (start < TABLE_H) segs.push({ x1, y1: y1 + start, x2, y2, horiz: false });
    }
  }
  add(0, 0, TABLE_W, 0, true);
  add(0, TABLE_H, TABLE_W, TABLE_H, true);
  add(0, 0, 0, TABLE_H, false);
  add(TABLE_W, 0, TABLE_W, TABLE_H, false);
  return segs;
}

const CUSHION_SEGMENTS = buildCushionSegments();

// closest point on segment
function closestPt(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const l2 = dx * dx + dy * dy;
  if (l2 === 0) return { x: x1, y: y1 };
  const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / l2));
  return { x: x1 + t * dx, y: y1 + t * dy };
}

// ==================== AIMING MODAL FUNCTIONS ====================
function drawCueFaceCanvas() {
  const c = document.getElementById('cueFaceCanvas');
  if (!c) return;
  const cx = 75, cy = 75, r = 66, dotR = 11;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  c.width = 150 * dpr; c.height = 150 * dpr;
  c.style.width = '150px'; c.style.height = '150px';
  const cctx = c.getContext('2d');
  cctx.setTransform(1, 0, 0, 1, 0, 0);
  cctx.scale(dpr, dpr);
  cctx.clearRect(0, 0, 150, 150);

  // Ball face
  const grad = cctx.createRadialGradient(cx - r * 0.15, cy - r * 0.2, r * 0.05, cx, cy, r);
  grad.addColorStop(0, '#fafaf5'); grad.addColorStop(0.6, '#dddcd0'); grad.addColorStop(1, '#999');
  cctx.fillStyle = grad;
  cctx.beginPath(); cctx.arc(cx, cy, r, 0, Math.PI * 2); cctx.fill();

  // Crosshair
  cctx.strokeStyle = 'rgba(0,0,0,0.07)'; cctx.lineWidth = 1;
  cctx.setLineDash([3, 5]);
  cctx.beginPath(); cctx.moveTo(cx - r + 12, cy); cctx.lineTo(cx + r - 12, cy); cctx.stroke();
  cctx.beginPath(); cctx.moveTo(cx, cy - r + 12); cctx.lineTo(cx, cy + r - 12); cctx.stroke();
  cctx.setLineDash([]);

  // Hit point
  const maxOff = r * 0.62;
  let hdx = (cueFaceHitX - 0.5) * 2 * maxOff, hdy = (cueFaceHitY - 0.5) * 2 * maxOff;
  const hd = Math.sqrt(hdx * hdx + hdy * hdy);
  if (hd > maxOff) { const s = maxOff / hd; hdx *= s; hdy *= s; }
  const hpx = cx + hdx, hpy = cy + hdy;

  const hg = cctx.createRadialGradient(hpx - 2, hpy - 2, 1, hpx, hpy, dotR);
  hg.addColorStop(0, '#fff'); hg.addColorStop(0.4, '#e94560'); hg.addColorStop(1, '#8b1a2b');
  cctx.fillStyle = hg;
  cctx.beginPath(); cctx.arc(hpx, hpy, dotR, 0, Math.PI * 2); cctx.fill();
  cctx.strokeStyle = 'rgba(255,255,255,0.6)'; cctx.lineWidth = 2;
  cctx.beginPath(); cctx.arc(hpx, hpy, dotR + 2, 0, Math.PI * 2); cctx.stroke();
}

function setupCueFaceCanvas() {
  const c = document.getElementById('cueFaceCanvas');
  if (!c) return;
  const getHit = (e) => {
    const rect = c.getBoundingClientRect();
    const cx = rect.width / 2, cy = rect.height / 2;
    const r = 66, maxOff = r * 0.62;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const px = clientX - rect.left - cx, py = clientY - rect.top - cy;
    const dist = Math.sqrt(px * px + py * py);
    const clamped = Math.min(dist, maxOff);
    const scale = dist > 0.01 ? clamped / dist : 1;
    return {
      x: Math.max(0, Math.min(1, 0.5 + (px * scale) / (2 * maxOff))),
      y: Math.max(0, Math.min(1, 0.5 + (py * scale) / (2 * maxOff)))
    };
  };
  c.addEventListener('pointerdown', (e) => {
    e.preventDefault(); isDraggingCueFace = true;
    const hit = getHit(e); cueFaceHitX = hit.x; cueFaceHitY = hit.y;
    syncCueFromFace(); drawCueFaceCanvas();
  });
  c.addEventListener('pointermove', (e) => {
    if (!isDraggingCueFace) return; e.preventDefault();
    const hit = getHit(e); cueFaceHitX = hit.x; cueFaceHitY = hit.y;
    syncCueFromFace(); drawCueFaceCanvas();
  });
  window.addEventListener('pointerup', () => { isDraggingCueFace = false; });
}

function syncCueFromFace() {
  if (cueFaceHitY < 0.33) cueHeight = 'high';
  else if (cueFaceHitY > 0.67) cueHeight = 'low';
  else cueHeight = 'mid';
  if (cueFaceHitX < 0.35) cueSpin = 'left';
  else if (cueFaceHitX > 0.65) cueSpin = 'right';
  else cueSpin = 'none';
  syncAllCueControls();
}

function syncFaceFromCue() {
  if (cueHeight === 'high') cueFaceHitY = 0.12;
  else if (cueHeight === 'low') cueFaceHitY = 0.88;
  else cueFaceHitY = 0.5;
  if (cueSpin === 'left') cueFaceHitX = 0.12;
  else if (cueSpin === 'right') cueFaceHitX = 0.88;
  else cueFaceHitX = 0.5;
}

function syncAllCueControls() {
  document.querySelectorAll('[data-height]').forEach(b => b.classList.toggle('active', b.dataset.height === cueHeight));
  document.querySelectorAll('.modal-height-btn').forEach(b => b.classList.toggle('active', b.dataset.height === cueHeight));
  document.querySelectorAll('[data-spin]').forEach(b => b.classList.toggle('active', b.dataset.spin === cueSpin));
  document.querySelectorAll('.modal-spin-btn').forEach(b => b.classList.toggle('active', b.dataset.spin === cueSpin));
  document.getElementById('speedSlider').value = cueSpeed;
  document.getElementById('speedVal').textContent = cueSpeed;
  const ms = document.getElementById('modalSpeedSlider');
  if (ms) { ms.value = cueSpeed; document.getElementById('modalSpeedVal').textContent = cueSpeed + ' m/s'; }
}

function recalcPathFromFirstCushion(route, newFirstCushion) {
  // Rebuild mirrored targets from ghost ball (same as calculateKickRoutes)
  const targetBall = balls.find(b => b.type === 'target');
  if (!targetBall || !pocketTarget) return null;

  const dx = targetBall.x - pocketTarget.x;
  const dy = targetBall.y - pocketTarget.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const ghostX = targetBall.x + (dx / dist) * BALL_R * 2;
  const ghostY = targetBall.y + (dy / dist) * BALL_R * 2;

  const seqIndices = route.sequence.map(name => CUSHIONS.findIndex(c => c.name === name));

  // Build mirrored targets backward from ghost ball
  let mx = ghostX, my = ghostY;
  const mirroredTargets = [{ x: mx, y: my }];
  for (let i = seqIndices.length - 1; i >= 0; i--) {
    const gc = GHOST_CUSHIONS[seqIndices[i]];
    const ref = reflectPoint(mx, my, gc);
    mx = ref.x; my = ref.y;
    mirroredTargets.unshift({ x: mx, y: my });
  }

  // Convert snapped table-edge point to ghost-cushion coordinates
  const firstCushion = CUSHIONS[seqIndices[0]];
  let cx = newFirstCushion.x, cy = newFirstCushion.y;
  if (firstCushion.horiz) {
    cy = firstCushion.y1 === 0 ? BALL_R : TABLE_H - BALL_R;
  } else {
    cx = firstCushion.x1 === 0 ? BALL_R : TABLE_W - BALL_R;
  }

  // Trace forward from new first cushion point through remaining cushions
  const newHitPoints = [{ x: cx, y: cy }];
  const newAllPoints = [
    { x: route.points[0].x, y: route.points[0].y },
    { x: cx, y: cy }
  ];
  let valid = true;

  for (let i = 1; i < seqIndices.length; i++) {
    const gc = GHOST_CUSHIONS[seqIndices[i]];
    const target = mirroredTargets[i];
    const inter = lineIntersection(cx, cy, target.x, target.y, gc.x1, gc.y1, gc.x2, gc.y2);
    if (!inter) { valid = false; break; }
    if (inter.t < 0 || inter.t > 1.05) { valid = false; break; }
    if (!pointOnCushionSegment(inter, gc)) { valid = false; break; }
    newHitPoints.push({ x: inter.x, y: inter.y });
    newAllPoints.push({ x: inter.x, y: inter.y });
    cx = inter.x; cy = inter.y;
  }

  if (!valid) return null;

  newAllPoints.push({ x: ghostX, y: ghostY });
  newAllPoints.push({ x: pocketTarget.x, y: pocketTarget.y });

  // Calculate total distance
  let totalDist = 0;
  for (let i = 0; i < newAllPoints.length - 1; i++) {
    const ddx = newAllPoints[i+1].x - newAllPoints[i].x;
    const ddy = newAllPoints[i+1].y - newAllPoints[i].y;
    totalDist += Math.sqrt(ddx * ddx + ddy * ddy);
  }

  return {
    points: newAllPoints,
    cushionPoints: newHitPoints,
    totalDist,
    sequence: route.sequence,
  };
}

function snapToCushionSegment(pt, cushionName) {
  const m = POCKET_R + BALL_R;
  const sm = SIDE_POCKET_R + BALL_R;
  const hw = TABLE_W / 2;
  if (cushionName === 'top') {
    let x = Math.max(m, Math.min(TABLE_W - m, pt.x));
    if (x > hw - sm && x < hw + sm) x = (x < hw) ? hw - sm : hw + sm;
    return { x, y: 0 };
  }
  if (cushionName === 'bottom') {
    let x = Math.max(m, Math.min(TABLE_W - m, pt.x));
    if (x > hw - sm && x < hw + sm) x = (x < hw) ? hw - sm : hw + sm;
    return { x, y: TABLE_H };
  }
  if (cushionName === 'left') {
    let y = Math.max(m, Math.min(TABLE_H - m, pt.y));
    return { x: 0, y };
  }
  if (cushionName === 'right') {
    let y = Math.max(m, Math.min(TABLE_H - m, pt.y));
    return { x: TABLE_W, y };
  }
  return pt;
}

function openAimModal() {
  if (!calculatedRoutes.length) {
    calculatedRoutes = calculateKickRoutes();
    updateInfo();
  }
  if (!calculatedRoutes.length) return;
  aimModalOpen = true;
  adjustedFirstCushion = null;
  isDraggingCushionPoint = false;
  syncFaceFromCue();
  document.getElementById('aimModal').classList.remove('hidden');
  document.getElementById('modalSpeedSlider').value = cueSpeed;
  document.getElementById('modalSpeedVal').textContent = cueSpeed + ' m/s';
  syncAllCueControls();
  drawCueFaceCanvas();
}

function closeAimModal() {
  aimModalOpen = false;
  isDraggingCushionPoint = false;
  document.getElementById('aimModal').classList.add('hidden');
}

function runSimulationWithAdjustment(route) {
  // Use custom route if available
  if (customRoute) {
    runSimulation(customRoute);
    return;
  }
  if (adjustedFirstCushion && route.cushionPoints.length > 0) {
    const orig = route.cushionPoints[0];
    const dx = adjustedFirstCushion.x - orig.x;
    const dy = adjustedFirstCushion.y - orig.y;
    if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
      const adjustedRoute = { ...route };
      adjustedRoute.cushionPoints = [adjustedFirstCushion, ...route.cushionPoints.slice(1)];
      runSimulation(adjustedRoute);
      return;
    }
  }
  runSimulation(route);
}

function stopSimulation(finalResult) {
  simRunning = false;
  simPhysicsBodies = null;
  simResult = finalResult || null;
  const btn = document.getElementById('btnSim');
  if (finalResult) {
    btn.textContent = finalResult.targetPocketed ? '物理模拟 ✓进球' :
                      finalResult.cueScratched ? '物理模拟 ✗母球落袋' :
                      '物理模拟 ✗未进';
  } else {
    btn.textContent = '物理模拟';
  }
}

function runSimulation(route) {
  stopSimulation();
  simRunning = true;
  document.getElementById('btnSim').textContent = '停止模拟';
  physicsTrails = [];

  // --- Ball physics state (all in mm, mm/s, rad/s) ---
  const speedMs = cueSpeed * 1000; // m/s → mm/s
  const firstCushion = route.cushionPoints[0];
  let aimAng = Math.atan2(firstCushion.y - route.points[0].y, firstCushion.x - route.points[0].x);
  if (cueSpin === 'left') aimAng -= 0.05;
  if (cueSpin === 'right') aimAng += 0.05;

  const physBalls = balls.map((b) => {
    const pb = {
      x: b.x, y: b.y,
      vx: 0, vy: 0,
      omega: 0,
      r: BALL_R,
      type: b.type,
      pocketed: false,
      cueHitTarget: false, // track if cue ball already hit target
    };
    if (b.type === 'cue') {
      pb.vx = Math.cos(aimAng) * speedMs;
      pb.vy = Math.sin(aimAng) * speedMs;
      // Initial spin: high=topspin(+), low=backspin(-), side=left/right
      const baseSpin = speedMs / BALL_R; // natural rolling angular velocity
      if (cueHeight === 'high') pb.omega = baseSpin * 1.5;
      else if (cueHeight === 'low') pb.omega = -baseSpin * 1.2;
      else pb.omega = 0; // stun shot (no initial spin)
      if (cueSpin === 'left') pb.omega -= speedMs / BALL_R * 0.8;
      if (cueSpin === 'right') pb.omega += speedMs / BALL_R * 0.8;
    }
    return pb;
  });

  simPhysicsBodies = physBalls;

  // Trail tracking
  const trailData = physBalls.map((pb) => ({
    points: [{ x: pb.x, y: pb.y }],
    color: pb.type === 'cue' ? '#fff' : pb.type === 'target' ? '#4FC3F7' : '#EF5350',
    type: pb.type,
  }));
  physicsTrails = trailData;

  let targetPocketed = false;
  let cuePocketed = false;
  let frameCount = 0;
  const MAX_FRAMES = 600;

  function physStep() {
    if (!simRunning) return;
    if (frameCount >= MAX_FRAMES) { stopSimulation(null); return; }
    frameCount++;

    // --- Sub-stepping for stability ---
    const subSteps = 2;
    const subDt = PHYS_DT / subSteps;
    for (let s = 0; s < subSteps; s++) {
      // 1. Apply cloth friction
      for (const pb of physBalls) {
        if (pb.type === 'obstacle' || pb.pocketed) continue;
        const spd = Math.sqrt(pb.vx * pb.vx + pb.vy * pb.vy);
        if (spd < 0.5 && Math.abs(pb.omega) < 0.1) {
          pb.vx = 0; pb.vy = 0; pb.omega = 0; continue;
        }
        // Surface speed at contact point (simplified: ball always tends toward natural roll)
        const surfaceV = spd - Math.abs(pb.omega) * pb.r;
        let frictionDecel;
        if (Math.abs(surfaceV) < 20) {
          // Near rolling → low friction
          frictionDecel = PHYS_MU_ROLL * PHYS_G;
          const ratio = spd > 0.1 ? Math.max(0, (spd - frictionDecel * subDt) / spd) : 0;
          pb.vx *= ratio; pb.vy *= ratio;
          pb.omega *= 0.995;
        } else {
          // Sliding → higher friction, torque spins the ball toward rolling
          frictionDecel = PHYS_MU_SLIDE * PHYS_G;
          const ratio = spd > 0.1 ? Math.max(0, (spd - frictionDecel * subDt) / spd) : 0;
          pb.vx *= ratio; pb.vy *= ratio;
          // Friction gradually builds spin toward natural roll magnitude
          const naturalOmegaMag = spd / pb.r;
          const omegaDeficit = naturalOmegaMag - Math.abs(pb.omega);
          if (pb.omega >= 0) pb.omega += omegaDeficit * 0.08;
          else pb.omega -= omegaDeficit * 0.08;
        }
      }

      // 2. Update positions
      for (const pb of physBalls) {
        if (pb.type === 'obstacle' || pb.pocketed) continue;
        pb.x += pb.vx * subDt;
        pb.y += pb.vy * subDt;
      }

      // 2.5. Clamp positions to table bounds (safety net)
      for (const pb of physBalls) {
        if (pb.type === 'obstacle' || pb.pocketed) continue;
        if (pb.x < BALL_R) { pb.x = BALL_R; pb.vx = Math.abs(pb.vx); }
        if (pb.x > TABLE_W - BALL_R) { pb.x = TABLE_W - BALL_R; pb.vx = -Math.abs(pb.vx); }
        if (pb.y < BALL_R) { pb.y = BALL_R; pb.vy = Math.abs(pb.vy); }
        if (pb.y > TABLE_H - BALL_R) { pb.y = TABLE_H - BALL_R; pb.vy = -Math.abs(pb.vy); }
      }

      // 3. Cushion collisions
      for (const pb of physBalls) {
        if (pb.type === 'obstacle' || pb.pocketed) continue;
        for (const seg of CUSHION_SEGMENTS) {
          const cp = closestPt(pb.x, pb.y, seg.x1, seg.y1, seg.x2, seg.y2);
          const dx = pb.x - cp.x, dy = pb.y - cp.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist >= pb.r) continue;
          // Geometric normal (perpendicular to cushion, pointing inward)
          let nx, ny;
          if (seg.horiz) {
            nx = 0;
            ny = (seg.y1 < TABLE_H / 2) ? 1 : -1;
          } else {
            nx = (seg.x1 < TABLE_W / 2) ? 1 : -1;
            ny = 0;
          }
          // Push out
          pb.x += nx * (pb.r - dist);
          pb.y += ny * (pb.r - dist);
          // Normal velocity
          const vn = pb.vx * nx + pb.vy * ny;
          if (vn >= 0) continue; // moving away, skip
          // Tangential
          const tx = -ny, ty = nx;
          const vt = pb.vx * tx + pb.vy * ty;
          // Spin effect on tangential rebound (set to 0 for mirror-like reflection)
          const spinV = pb.omega * pb.r * PHYS_SPIN_EFFECT;
          pb.vx = -vn * PHYS_CUSHION_E * nx + (vt * PHYS_CUSHION_E + spinV) * tx;
          pb.vy = -vn * PHYS_CUSHION_E * ny + (vt * PHYS_CUSHION_E + spinV) * ty;
          // Cushion dampens spin
          pb.omega *= 0.55;
          playCushionSound(Math.abs(vn));
          break; // one collision per ball per substep
        }
      }

      // 4. Ball-ball collisions
      for (let i = 0; i < physBalls.length; i++) {
        const a = physBalls[i];
        if (a.type === 'obstacle' || a.pocketed) continue;
        for (let j = i + 1; j < physBalls.length; j++) {
          const b = physBalls[j];
          if (b.type === 'obstacle' || b.pocketed) continue;
          const dx = b.x - a.x, dy = b.y - a.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const minD = a.r + b.r;
          if (dist >= minD || dist < 0.01) continue;
          const nx = dx / dist, ny = dy / dist;
          // Push apart
          const overlap = (minD - dist) / 2;
          a.x -= nx * overlap; a.y -= ny * overlap;
          b.x += nx * overlap; b.y += ny * overlap;
          // Relative normal velocity
          const dvn = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
          if (dvn <= 0) continue; // separating
          playBallSound(dvn);
          // Equal-mass impulse: Δv_normal = dvn * (1+e) / 2
          const jn = dvn * (1 + PHYS_BALL_E) / 2;
          a.vx -= jn * nx; a.vy -= jn * ny;
          b.vx += jn * nx; b.vy += jn * ny;
          // Tangential friction at contact
          const tx = -ny, ty = nx;
          const dvt = (a.vx - b.vx) * tx + (a.vy - b.vy) * ty;
          const jt = dvt * 0.08;
          a.vx -= jt * tx; a.vy -= jt * ty;
          b.vx += jt * tx; b.vy += jt * ty;
          // Spin exchange
          const spinImpulse = jt / BALL_R * 0.4;
          a.omega += spinImpulse;
          b.omega -= spinImpulse;

          // High/Low cue effect on first cue→target hit
          if (a.type === 'cue' && b.type === 'target' && !a.cueHitTarget) {
            a.cueHitTarget = true;
            if (cueHeight === 'high') { a.vx *= 1.25; a.vy *= 1.25; a.omega += speedMs / BALL_R * 0.6; }
            else if (cueHeight === 'low') { a.vx *= -0.45; a.vy *= -0.45; a.omega = -speedMs / BALL_R * 0.6; }
          } else if (b.type === 'cue' && a.type === 'target' && !b.cueHitTarget) {
            b.cueHitTarget = true;
            if (cueHeight === 'high') { b.vx *= 1.25; b.vy *= 1.25; b.omega += speedMs / BALL_R * 0.6; }
            else if (cueHeight === 'low') { b.vx *= -0.45; b.vy *= -0.45; b.omega = -speedMs / BALL_R * 0.6; }
          }
        }
      }

      // 5. Pocket detection
      for (const pb of physBalls) {
        if (pb.pocketed) continue;
        for (const pp of POCKET_POSITIONS) {
          const d = Math.sqrt((pb.x - pp.x) ** 2 + (pb.y - pp.y) ** 2);
          if (d < pp.r + BALL_R * 0.5) {
            pb.pocketed = true;
            if (pb.type === 'target') targetPocketed = true;
            if (pb.type === 'cue') cuePocketed = true;
            break;
          }
        }
      }
    } // end sub-steps

    // Record trails
    physBalls.forEach((pb, i) => {
      trailData[i].points.push({ x: pb.x, y: pb.y });
    });

    // Stop checks
    if (targetPocketed && frameCount > 10) { stopSimulation({ targetPocketed: true, cueScratched: false }); return; }
    if (cuePocketed && frameCount > 10) { stopSimulation({ targetPocketed: false, cueScratched: true }); return; }

    let allStill = true;
    for (const pb of physBalls) {
      if (pb.type === 'obstacle' || pb.pocketed) continue;
      if (Math.abs(pb.vx) > 10 || Math.abs(pb.vy) > 10) { allStill = false; break; }
    }
    if (allStill && frameCount > 120) {
      stopSimulation({ targetPocketed, cueScratched: cuePocketed });
      return;
    }

    requestAnimationFrame(physStep);
  }

  requestAnimationFrame(physStep);
}

// ==================== UI HANDLERS ====================
function updateInfo() {
  const info = document.getElementById('routeInfo');
  const cue = balls.find(b => b.type === 'cue');
  const target = balls.find(b => b.type === 'target');
  const obstacles = balls.filter(b => b.type === 'obstacle');

  let msg = '';
  if (!cue) msg = '👆 点击桌面放置母球（白色）';
  else if (!target) msg = '👆 点击桌面放置目标球（蓝色）';
  else if (!pocketTarget) msg = '👆 切换至袋口模式，点击目标袋口';
  else if (hasCalculated && calculatedRoutes.length === 0) {
    msg = `❌ 未找到符合条件的${cushionCount}星解球路线，请调整球位或颗星数`;
  } else if (calculatedRoutes.length) {
    const best = calculatedRoutes[0];
    const seqStr = best.sequence.join('→');
    const distStr = (best.totalDist / 100).toFixed(0);
    msg = `${calculatedRoutes.length}条路线 · 最佳: ${seqStr} (${distStr}dm)`;
  } else {
    msg = `就绪 · ${obstacles.length ? obstacles.length + '个障碍 ' : ''}${cushionCount}星解球`;
  }

  info.textContent = msg;

  if (hasCalculated && calculatedRoutes.length === 0) {
    info.style.color = '#f08080';
  } else {
    info.style.color = '#aaa';
  }

  updateRouteSelector();
}

function updateRouteSelector() {
  const container = document.getElementById('routeSelector');
  if (!calculatedRoutes.length) {
    container.classList.add('hidden');
    container.innerHTML = '';
    return;
  }
  container.classList.remove('hidden');

  const colors = ['#FFD700', '#FF6B6B', '#4ECDC4', '#FF8C42', '#A78BFA'];

  container.innerHTML = calculatedRoutes.map((route, i) => {
    const color = colors[i % colors.length];
    const seqStr = route.sequence.map(s => {
      const names = { top: '上', bottom: '下', left: '左', right: '右' };
      return names[s] || s;
    }).join('→');
    const distStr = (route.totalDist / 100).toFixed(0) + 'dm';
    const selected = i === selectedRouteIndex ? ' selected' : '';
    return `<button class="route-chip${selected}" data-route="${i}">
      <span class="dot" style="background:${color}"></span>
      ${seqStr}
      <span class="dist">${distStr}</span>
    </button>`;
  }).join('');

  // Click handler for route chips
  container.querySelectorAll('.route-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      selectedRouteIndex = parseInt(chip.dataset.route);
      customRoute = null;
      updateRouteSelector();
    });
  });
}

// Ball type buttons
document.querySelectorAll('[data-type]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedType = btn.dataset.type;
  });
});

// Cushion count buttons
document.querySelectorAll('.cushion-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cushion-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    cushionCount = parseInt(btn.dataset.n);
    calculatedRoutes = [];
    customRoute = null;
    selectedRouteIndex = 0;
    hasCalculated = false;
    updateInfo();
  });
});

// Calculate button
document.getElementById('btnCalc').addEventListener('click', () => {
  if (simRunning) stopSimulation(null);
  physicsTrails = [];
  simResult = null;
  customRoute = null;
  calculatedRoutes = calculateKickRoutes();
  hasCalculated = true;
  updateInfo();
});

// Simulate button - opens aiming modal
document.getElementById('btnSim').addEventListener('click', () => {
  if (simRunning) {
    stopSimulation();
    document.getElementById('btnSim').textContent = '物理模拟';
    return;
  }
  openAimModal();
});

// Clear button
document.getElementById('btnClear').addEventListener('click', () => {
  stopSimulation();
  balls = [];
  pocketTarget = null;
  calculatedRoutes = [];
  selectedRouteIndex = 0;
  physicsTrails = [];
  document.getElementById('btnSim').textContent = '物理模拟';
  updateInfo();
});

// Speed slider
const speedSlider = document.getElementById('speedSlider');
const speedVal = document.getElementById('speedVal');
speedSlider.addEventListener('input', () => {
  cueSpeed = parseFloat(speedSlider.value);
  speedVal.textContent = cueSpeed;
});

// Cue height buttons
document.querySelectorAll('[data-height]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-height]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    cueHeight = btn.dataset.height;
  });
});

// Cue spin buttons
document.querySelectorAll('[data-spin]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-spin]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    cueSpin = btn.dataset.spin;
  });
});

// ==================== AIMING MODAL WIRING ====================
setupCueFaceCanvas();

document.getElementById('modalClose').addEventListener('click', closeAimModal);
document.getElementById('modalCancel').addEventListener('click', closeAimModal);

// Close modal on outside click
document.getElementById('aimModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeAimModal();
});

document.getElementById('modalStartSim').addEventListener('click', () => {
  closeAimModal();
  if (!calculatedRoutes.length) return;
  physicsTrails = [];
  runSimulationWithAdjustment(calculatedRoutes[selectedRouteIndex]);
});

// Modal speed slider
document.getElementById('modalSpeedSlider').addEventListener('input', (e) => {
  cueSpeed = parseFloat(e.target.value);
  document.getElementById('modalSpeedVal').textContent = cueSpeed + ' m/s';
  document.getElementById('speedSlider').value = cueSpeed;
  document.getElementById('speedVal').textContent = cueSpeed;
});

// Modal cue height buttons
document.querySelectorAll('.modal-height-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    cueHeight = btn.dataset.height;
    syncFaceFromCue();
    syncAllCueControls();
    drawCueFaceCanvas();
  });
});

// Modal spin buttons
document.querySelectorAll('.modal-spin-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    cueSpin = btn.dataset.spin;
    syncFaceFromCue();
    syncAllCueControls();
    drawCueFaceCanvas();
  });
});

// Initial draw
updateInfo();
loop();

// Debug hook
window.__app = {
  get balls() { return balls; },
  get pocketTarget() { return pocketTarget; },
  get calculatedRoutes() { return calculatedRoutes; },
  get cushionCount() { return cushionCount; },
  get simRunning() { return simRunning; },
  get simBodies() { return simPhysicsBodies ? simPhysicsBodies.map(pb => ({ type: pb.type, x: pb.x, y: pb.y, vx: pb.vx, vy: pb.vy, omega: pb.omega, pocketed: pb.pocketed })) : null; },
  calculate: () => { calculatedRoutes = calculateKickRoutes(); updateInfo(); return calculatedRoutes; },
};
</script>
